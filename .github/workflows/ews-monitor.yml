name: EWS monitor

on:
  schedule:
    - cron: "5,35 * * * *"
    - cron: "0 18 * * 6"
  workflow_dispatch:
    inputs:
      heartbeat:
        description: "Enviar latido de prueba ahora"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ews-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Consultar EWS y avisar
        env:
          EWS_MODE: ${{ vars.EWS_MODE }}
          EWS_DASHBOARD_URL: ${{ vars.EWS_DASHBOARD_URL }}
          EWS_THRESHOLD: ${{ vars.EWS_THRESHOLD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EWS_HEARTBEAT: ${{ (github.event.schedule == '0 18 * * 6' || github.event.inputs.heartbeat == 'true') && '1' || '' }}
        run: python ews_alert.py

      - name: Persistir estado e historico
        run: |
          git config user.name  "ews-bot"
          git config user.email "ews-bot@users.noreply.github.com"
          git add ews_log.csv 2>/dev/null || true
          git add ews_state.json 2>/dev/null || true
          git diff --cached --quiet || git commit -m "ews: update state/log"
          git push
